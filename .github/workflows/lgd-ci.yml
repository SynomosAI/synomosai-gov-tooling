name: LGD CI

# 共享守门：布局 + JSON 卫生。业务测试保留在仓内自有 CI。
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    uses: SynomosAI/ci/.github/workflows/lgd-reusable-ci.yml@1e9f786f516f9c17377d78d0626eb89d68115e66
    with:
      python-version: "3.11"
      run-tests: false
      require-skill-md: false