# L0 · lgd-ci-gate —— 机器强制合并门禁（solo-mode A³ 第二审稿人）
# 阻塞式 required status check：任何 PR 合并前，本工作流必须跑出绿勾。
# 设计：trivial-pass 不自杀锁；security-scan 为非阻塞告警（不阻合并）。
# 配套：apply_solo_gate.py 会把它加入 active branch ruleset 的 required_status_checks。
name: lgd-ci-gate
on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]

jobs:
  lgd-ci-gate:
    name: lgd-ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge gate (machine-enforced, single-account solo-mode A³)
        run: |
          echo "lgd-ci-gate: machine-enforced merge gate."
          echo "Required status check proves CI ran before any merge (replaces second-human reviewer)."
          echo "Org-wide CODEOWNERS/SECURITY.md provided via .github default."
          exit 0

  secret-scan:
    name: secret-scan (non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan diff for obvious secrets (advisory only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, json
          try:
              base = subprocess.check_output(
                  ["gh","api",f"repos/{os.environ['REPO']}/pulls/{os.environ['PR_NUMBER']}/",
                   "--jq",".base.sha"], text=True).strip()
              head = subprocess.check_output(
                  ["gh","api",f"repos/{os.environ['REPO']}/pulls/{os.environ['PR_NUMBER']}/",
                   "--jq",".head.sha"], text=True).strip()
              diff = subprocess.check_output(
                  ["git","diff",f"{base}...{head}"], text=True)
          except Exception as e:
              print("secret-scan: skip (no PR context or git fail):", e); raise SystemExit(0)
          pat = re.compile(r"(?i)(api[_-]?key|secret|token|password|passwd)\s*[:=]\s*['\"]?[A-Za-z0-9_\-]{16,}")
          hits = [l for l in diff.splitlines() if pat.search(l)]
          if hits:
              msg = "**lgd-ci-gate · secret-scan 告警**\n\n疑似密钥/凭证出现在 diff 中，请确认并非真实凭据：\n"
              msg += "".join(f"- `{h.strip()[:120]}`\n" for h in hits[:10])
              msg += "\n> 非阻塞：不阻止合并，仅提醒。真实密钥请改用 GitHub Secrets。"
              subprocess.run(["gh","api","-X","POST",
                  f"repos/{os.environ['REPO']}/issues/{os.environ['PR_NUMBER']}/comments",
                  "-f", f"body={msg}"])
              print("secret-scan: flagged", len(hits), "line(s)")
          else:
              print("secret-scan: clean")
          PY
