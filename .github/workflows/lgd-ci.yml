name: LGD CI

# 共享守门：布局 + JSON 卫生。业务测试保留在仓内自有 CI。
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    uses: SynomosAI/ci/.github/workflows/lgd-reusable-ci.yml@e1494968cbcd95b854bf7ab8e4d2ed1737ca12dd
    with:
      python-version: "3.11"
      run-tests: false
      require-skill-md: false